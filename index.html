<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>商务英语今日热词学习</title>
    <meta name="description" content="基于财富中文商务英语今日热词来源的随机单词和短语学习页。">
    <link rel="preconnect" href="https://api.memegen.link">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="刷新学习页">
          <span class="brand-mark">BE</span>
          <span>
            <strong>商务英语今日热词</strong>
            <small>Fortune China sourced learning deck</small>
          </span>
        </a>
        <nav class="actions" aria-label="页面操作">
          <button class="icon-button" id="refreshButton" type="button" title="换一组">
            <span aria-hidden="true">↻</span>
            <span class="sr-only">换一组</span>
          </button>
          <button class="ghost-button" id="knowledgeButton" type="button">知识库</button>
        </nav>
      </header>

      <main>
        <section class="hero" aria-labelledby="pageTitle">
          <div>
            <p class="eyebrow">每次刷新，学习一组新的商务单词和短语</p>
            <h1 id="pageTitle">从财富中文文章里抽取今天的商业表达。</h1>
          </div>
          <div class="source-pill" id="sourcePill"></div>
        </section>

        <section class="learning-grid" aria-label="今日学习内容">
          <article class="lesson-card primary" id="wordCard">
            <div class="card-copy">
              <div class="card-kicker">今日热词</div>
              <h2 id="wordTerm"></h2>
              <button class="speak-button" id="wordSpeakButton" type="button" title="朗读今日热词">
                <span aria-hidden="true">▶</span>
                <span>Pronounce</span>
              </button>
              <dl class="definition-list">
                <div>
                  <dt>中文释义</dt>
                  <dd id="wordCn"></dd>
                </div>
                <div>
                  <dt>English</dt>
                  <dd id="wordEn"></dd>
                </div>
              </dl>
              <div class="example">
                <p id="wordExampleEn"></p>
                <button class="speak-button example-speak" id="wordExampleSpeakButton" type="button" title="朗读今日热词例句">
                  <span aria-hidden="true">▶</span>
                  <span>Example</span>
                </button>
                <p id="wordExampleCn"></p>
              </div>
            </div>
            <figure class="meme-frame">
              <img id="wordMeme" alt="今日热词相关 meme 图">
            </figure>
          </article>

          <article class="lesson-card secondary" id="phraseCard">
            <div class="card-copy">
              <div class="card-kicker">今日短语 / 商务短语</div>
              <h2 id="phraseTerm"></h2>
              <button class="speak-button" id="phraseSpeakButton" type="button" title="朗读今日短语">
                <span aria-hidden="true">▶</span>
                <span>Pronounce</span>
              </button>
              <dl class="definition-list">
                <div>
                  <dt>中文释义</dt>
                  <dd id="phraseCn"></dd>
                </div>
                <div>
                  <dt>English</dt>
                  <dd id="phraseEn"></dd>
                </div>
              </dl>
              <div class="example">
                <p id="phraseExampleEn"></p>
                <button class="speak-button example-speak" id="phraseExampleSpeakButton" type="button" title="朗读今日短语例句">
                  <span aria-hidden="true">▶</span>
                  <span>Example</span>
                </button>
                <p id="phraseExampleCn"></p>
              </div>
            </div>
            <figure class="meme-frame">
              <img id="phraseMeme" alt="今日短语相关 meme 图">
            </figure>
          </article>
        </section>
      </main>
    </div>

    <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
      <div class="drawer-panel" role="dialog" aria-modal="true">
        <div class="drawer-head">
          <div>
            <p class="eyebrow">Local knowledge base</p>
            <h2 id="drawerTitle">已出现内容</h2>
          </div>
          <button class="icon-button" id="closeDrawerButton" type="button" title="关闭">
            <span aria-hidden="true">×</span>
            <span class="sr-only">关闭知识库</span>
          </button>
        </div>
        <div class="drawer-stats" id="drawerStats"></div>
        <div class="kb-list" id="knowledgeList"></div>
        <button class="danger-button" id="clearKnowledgeButton" type="button">清空知识库</button>
      </div>
    </aside>

    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
